[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyFracAggregate"
version = "0.5.0"
description = "通用分形团簇生成框架 (General Fractal Aggregate Generation Framework)"
authors = [
    { name = "Fan Zhang", email = "vanvonzhang@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "fractal aggregate",
    "cluster-cluster aggregation",
    "aerosol",
    "soot",
    "fractal dimension",
    "nanoparticles",
    "DLCA",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "mathutils>=3.0.0",
    "pyvista",
    "pyyaml",
    "imageio[ffmpeg]>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/vanvonzhang/pyFracAggregate"
Documentation = "https://vanvonzhang.github.io/pyFracAggregate/"
Repository = "https://github.com/vanvonzhang/pyFracAggregate"
Issues = "https://github.com/vanvonzhang/pyFracAggregate/issues"

[project.optional-dependencies]
plot = [
    "matplotlib>=3.5.0",
]
dev = [
    "pytest",
    "ruff",
    "mypy"
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinxcontrib-mermaid>=1.0",
    "sphinx-copybutton>=0.5.0",
]

[tool.mypy]
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["mathutils", "yaml", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "benchmark: performance benchmark tests (deselect with '-m \"not benchmark\"')",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyFracAggregate"]
exclude = [
    "tests",
    "docs",
    "examples",
    ".github",
]

[tool.hatch.build.targets.sdist]
exclude = [
    ".github",
]
