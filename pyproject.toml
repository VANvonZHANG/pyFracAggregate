[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyFracAggregate"
version = "0.1.2"
description = "通用分形团簇生成框架 (General Fractal Aggregate Generation Framework)"
authors = [
    { name = "Fan Zhang", email = "vanvonzhang@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "mathutils>=3.0.0",
    "pyvista",
    "pyyaml",
    "imageio[ffmpeg]>=2.9.0",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.5.0",
]
dev = [
    "pytest",
    "ruff",
    "mypy"
]

[tool.pytest.ini_options]
markers = [
    "benchmark: performance benchmark tests (deselect with '-m \"not benchmark\"')",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyFracAggregate"]
exclude = [
    "tests",
    "docs",
    "examples",
    ".github",
]

[tool.hatch.build.targets.sdist]
exclude = [
    ".github",
]
